# nginx para contenedor sin privilegios y con readOnlyRootFilesystem:
# todo lo escribible vive en /tmp (montado como emptyDir en k8s).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  log_format json escape=json '{"time":"$time_iso8601","status":$status,"method":"$request_method",'
                              '"uri":"$uri","bytes":$body_bytes_sent,"duration":$request_time,'
                              '"ua":"$http_user_agent","trace":"$http_x_cloud_trace_context"}';
  # $uri (sin query string) para no escribir parámetros de búsqueda (CURP, nombres) en los logs.
  access_log /dev/stdout json;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  client_max_body_size 1k;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
  gzip_min_length 1024;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    include /etc/nginx/security-headers.conf;

    # Health check para las probes de Kubernetes.
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok";
    }

    # Archivos con hash en el nombre: caché larga e inmutable.
    location /assets/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    # El service worker y el manifiesto nunca se cachean, para que las actualizaciones lleguen.
    location ~* ^/(sw\.js|registerSW\.js|workbox-.*\.js|manifest\.webmanifest)$ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
      try_files $uri =404;
    }

    # /api la enruta el Ingress al back; si llega aquí es un error de enrutamiento.
    location /api/ {
      return 404;
    }

    # SPA: cualquier otra ruta devuelve index.html sin caché.
    location / {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
      try_files $uri $uri/ /index.html;
    }
  }
}

apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: crediexpress-front
spec:
  # Misma política de Cloud Armor que el back (la crea preparar-gcp.ps1 en el repo del back).
  securityPolicy:
    name: crediexpress-armor
  healthCheck:
    type: HTTP
    requestPath: /healthz
    port: 8080
    checkIntervalSec: 15
    timeoutSec: 5

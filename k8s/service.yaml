apiVersion: v1
kind: Service
metadata:
  name: crediexpress-front
  labels:
    app.kubernetes.io/name: crediexpress-front
    app.kubernetes.io/part-of: crediexpress
  annotations:
    # NEG: el balanceador llega directo a los pods. BackendConfig: Cloud Armor + health check.
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "crediexpress-front"}'
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: crediexpress-front
  ports:
    - name: http
      port: 80
      targetPort: http
